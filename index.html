<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Coach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --cream: #F0EAE2;
    --charcoal: #2B2E2A;
    --ivory: #C9A876;
    --red: #9B4A3F;
    --line: #d9d0c1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Source Serif 4', serif;
    display: flex;
    min-height: 100vh;
  }

  /* Left column: scoresheet */
  .scoresheet {
    width: 260px;
    border-right: 1px solid var(--line);
    padding: 32px 24px;
    flex-shrink: 0;
  }

  .scoresheet h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }

  .scoresheet p.tagline {
    font-size: 14px;
    color: #6b6459;
    margin: 0 0 32px 0;
    max-width: 200px;
    line-height: 1.5;
  }

  .move-list {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #6b6459;
    line-height: 2;
  }

  .move-list .move-row {
    display: flex;
    justify-content: space-between;
  }

  .move-list .flagged {
    color: var(--red);
    font-weight: 500;
  }

  /* Main area */
  main {
    flex: 1;
    padding: 48px 56px;
    max-width: 760px;
  }

  textarea {
    width: 100%;
    height: 140px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 16px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--charcoal);
    border-radius: 2px;
    resize: vertical;
  }

  textarea:focus {
    outline: 2px solid var(--ivory);
    outline-offset: -1px;
  }

  button {
    margin-top: 16px;
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 22px;
    background: var(--charcoal);
    color: var(--cream);
    border: none;
    border-radius: 2px;
    cursor: pointer;
  }

  button:hover { background: #1c1e1b; }
  button:disabled { background: #a8a29a; cursor: default; }

  .status {
    margin-top: 16px;
    font-size: 14px;
    color: #6b6459;
    font-style: italic;
  }

  .annotations {
    margin-top: 40px;
  }

  .annotation {
    border-left: 3px solid var(--ivory);
    padding: 4px 0 4px 20px;
    margin-bottom: 28px;
  }

  .annotation.mistake { border-left-color: var(--red); }

  .annotation .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #6b6459;
    margin-bottom: 6px;
  }

  .annotation .meta .mark {
    color: var(--red);
    font-weight: 500;
  }

  .annotation p {
    margin: 0;
    font-size: 16px;
    line-height: 1.6;
  }

  .empty-note {
    margin-top: 40px;
    font-size: 14px;
    color: #6b6459;
    font-style: italic;
  }
</style>
</head>
<body>

  <div class="scoresheet">
    <h1>Chess Coach</h1>
    <p class="tagline">Paste a finished game. It reads the position like a scoresheet and annotates where the game turned.</p>
    <div class="move-list" id="moveList"></div>
  </div>

  <main>
    <textarea id="pgnInput" placeholder="Paste your PGN here — e.g. 1. e4 e5 2. Nf3 Nc6 ..."></textarea>
    <br>
    <button id="analyzeBtn" onclick="analyzeGame()">Analyze game</button>
    <div class="status" id="status"></div>

    <div class="annotations" id="results"></div>
  </main>

<script>
async function analyzeGame() {
  const pgnText = document.getElementById('pgnInput').value.trim();
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const btn = document.getElementById('analyzeBtn');

  if (!pgnText) {
    status.textContent = "Paste a game first — the notation of the moves you actually played.";
    return;
  }

  btn.disabled = true;
  results.innerHTML = "";
  status.textContent = "Reading the game and checking each position against the engine — this can take a minute per flagged move.";

  try {
    const response = await fetch("http://127.0.0.1:8000/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pgn_text: pgnText })
    });

    const data = await response.json();

    if (data.error) {
      status.textContent = data.error;
      btn.disabled = false;
      return;
    }

    if (data.mistakes.length === 0) {
      status.textContent = "";
      results.innerHTML = '<div class="empty-note">No moment crossed the threshold for a mistake in this game.</div>';
    } else {
      status.textContent = `Found ${data.mistakes.length} moment${data.mistakes.length > 1 ? 's' : ''} worth a closer look.`;
      data.mistakes.forEach(m => {
        const div = document.createElement('div');
        div.className = 'annotation mistake';
        div.innerHTML = `
          <div class="meta">Move ${m.move_number} · ${m.player} played <span class="mark">${m.move}</span> · better was ${m.better_move}</div>
          <p>${m.explanation}</p>
        `;
        results.appendChild(div);
      });
    }
  } catch (err) {
    status.textContent = "Could not reach the analysis server. Make sure it's running on port 8000.";
  }

  btn.disabled = false;
}
</script>

</body>
</html>
